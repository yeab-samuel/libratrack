# ??? Database ????????????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libratrack}
spring.datasource.username=${DB_USER:libratrack}
spring.datasource.password=${DB_PASS:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ??? JPA / Hibernate ?????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=validate  
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ??? Flyway ??????????????????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ??? Security ????????????????????????????????????????????????????????????????
app.jwt.secret=${JWT_SECRET:default-dev-secret-32-chars-min!!!}
app.cron-secret=${CRON_SECRET:dev-only-change-me}

# ??? Loan limits ?????????????????????????????????????????????????????????????
app.max-loans-student=${MAX_LOANS_STUDENT:3}
app.max-loans-faculty=${MAX_LOANS_FACULTY:5}
app.max-loan-days-student=${MAX_LOAN_DAYS_STUDENT:14}
app.max-loan-days-faculty=${MAX_LOAN_DAYS_FACULTY:30}

# ??? Fine policy ?????????????????????????????????????????????????????????????
app.daily-fine-rate=${FINE_DAILY_RATE:0.50}
app.fine-grace-days=${FINE_GRACE_DAYS:2}
app.fine-escalation-days=${FINE_ESCALATION_DAYS:14}

# ?? Email / Notifications (Resend HTTP API ? no SMTP, works on any host) ??
resend.api-key=${RESEND_API_KEY:}
app.mail.enabled=${MAIL_ENABLED:false}

# ??? Server ??????????????????????????????????????????????????????????????????
server.port=${PORT:9090}

# ??? Actuator / API docs ?????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.data.web.pageable.max-page-size=100