# =============================================================================
# LibraTrack — Test Configuration
# This file is ONLY loaded by Maven Surefire when running "mvn test".
# It is NEVER loaded by "mvn spring-boot:run" or the production JAR,
# because Spring Boot excludes src/test/resources from the packaged artifact.
#
# @DataJpaTest and @WebMvcTest slice tests use H2 in-memory automatically.
# @SpringBootTest integration tests (SecurityIntegrationTest) override the
# datasource via @DynamicPropertySource and re-enable Flyway there.
# =============================================================================

# ── Flyway ─────────────────────────────────────────────────────────────────────
# Disabled for unit/slice tests — Hibernate builds the H2 schema from entities.
# SecurityIntegrationTest overrides this to true via @DynamicPropertySource.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# ── JWT ────────────────────────────────────────────────────────────────────────
app.jwt.secret=test-secret-must-be-at-least-32-chars!!

# ── Business Rules ─────────────────────────────────────────────────────────────
app.max-loans-student=3
app.max-loans-faculty=5
